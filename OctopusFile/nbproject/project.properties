# ============================================================
# OCTOPUSFILE - NETBEANS PROJECT PROPERTIES
# ============================================================


# ============================================================
# ANNOTATION PROCESSING
# ============================================================

annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processor.options=
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output


# ============================================================
# DIRETÓRIOS DE BUILD
# ============================================================

build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form

# Diretório temporário de compilação
build.dir=build

build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources

# Apenas bibliotecas explicitamente configuradas
build.sysclasspath=ignore


# ============================================================
# TESTES
# ============================================================

build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results


# ============================================================
# IDENTIFICAÇÃO DO PROJETO
# ============================================================

project.name=OctopusFile


# ============================================================
# VERSIONAMENTO
# ============================================================

# A versão NÃO é definida aqui.

# O build.xml gera automaticamente:

# 1.YYYYMMDD.HHMMSS

# Exemplo:

# 1.20260810.165217

# JAR final:

# OctopusFile_1.20260810.165217.jar


# ============================================================
# DISTRIBUIÇÃO
# ============================================================

# Arquivos excluídos da distribuição
dist.archive.excludes=

# Diretório padrão de distribuição do NetBeans
dist.dir=dist

# ------------------------------------------------------------
# IMPORTANTE
# ------------------------------------------------------------
#
# O NetBeans utiliza esta propriedade internamente.
#
# O build.xml personalizado NÃO utiliza este arquivo como
# JAR final.
#
# O JAR final é criado diretamente pelo build.xml:
#
# dist/OctopusFile_1.YYYYMMDD.HHMMSS.jar
#
# ------------------------------------------------------------

dist.jar=${dist.dir}/${project.name}.jar


# ============================================================
# JAVADOC
# ============================================================

dist.javadoc.dir=${dist.dir}/javadoc


# ============================================================
# JLINK
# ============================================================

dist.jlink.dir=${dist.dir}/jlink
dist.jlink.output=${dist.jlink.dir}/OctopusFile


# ============================================================
# ARQUIVOS INCLUÍDOS NO PROJETO
# ============================================================

excludes=
includes=**


# ============================================================
# CONFIGURAÇÃO DO JAR
# ============================================================

jar.compress=false


# ============================================================
# CLASSPATH
# ============================================================

javac.classpath=


# ============================================================
# COMPILADOR JAVA
# ============================================================

javac.compilerargs=

javac.deprecation=false

javac.external.vm=true


# ============================================================
# MODULEPATH
# ============================================================

javac.modulepath=

javac.processormodulepath=


# ============================================================
# ANNOTATION PROCESSORS
# ============================================================

javac.processorpath=\
    ${javac.classpath}


# ============================================================
# VERSÃO DO JAVA
# ============================================================

javac.source=17
javac.target=17


# ============================================================
# TESTES - COMPILAÇÃO
# ============================================================

javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}

javac.test.modulepath=\
    ${javac.modulepath}

javac.test.processorpath=\
    ${javac.test.classpath}


# ============================================================
# JAVADOC
# ============================================================

javadoc.additionalparam=

javadoc.author=false

javadoc.encoding=${source.encoding}

javadoc.html5=false

javadoc.noindex=false

javadoc.nonavbar=false

javadoc.notree=false

javadoc.private=false

javadoc.splitindex=true

javadoc.use=true

javadoc.version=false

javadoc.windowtitle=


# ============================================================
# JLINK
# ============================================================

jlink.additionalmodules=

jlink.additionalparam=

jlink.launcher=true

jlink.launcher.name=OctopusFile


# ============================================================
# META-INF
# ============================================================

meta.inf.dir=${src.dir}/META-INF


# ============================================================
# DISTRIBUIÇÃO JLINK
# ============================================================

mkdist.disabled=true


# ============================================================
# PLATAFORMA JAVA
# ============================================================

platform.active=default_platform


# ============================================================
# EXECUÇÃO
# ============================================================

run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}

run.jvmargs=

run.modulepath=\
    ${javac.modulepath}


# ============================================================
# TESTES - EXECUÇÃO
# ============================================================

run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}

run.test.modulepath=\
    ${javac.test.modulepath}


# ============================================================
# CODIFICAÇÃO
# ============================================================

source.encoding=UTF-8


# ============================================================
# CÓDIGO-FONTE
# ============================================================

src.dir=src

test.src.dir=test